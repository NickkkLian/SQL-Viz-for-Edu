<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
:root{
  --bg:#07090f;--s1:#0c0f1a;--s2:#111422;--s3:#171c2e;
  --b1:#1d2236;--b2:#262d4a;--b3:#363e62;
  --tx:#d8e0f8;--t2:#7a84b0;--t3:#3e4668;
  --cy:#00e5b8;--cy2:rgba(0,229,184,.08);--cy3:rgba(0,229,184,.18);
  --pu:#a78bfa;--pu2:rgba(167,139,250,.1);--pu3:rgba(167,139,250,.18);
  --gn:#34d399;--gn2:rgba(52,211,153,.1);
  --am:#fbbf24;--am2:rgba(251,191,36,.1);
  --rd:#f87171;--rd2:rgba(248,113,113,.1);
  --bl:#60a5fa;--bl2:rgba(96,165,250,.1);
  --sans:"Inter",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column;height:100vh}
/* Loading */
#ld{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s}
.ld-name{font-size:28px;font-weight:700;color:var(--cy);letter-spacing:2px}
.ld-bar{width:180px;height:3px;background:var(--b1);border-radius:3px;overflow:hidden}
.ld-prog{height:100%;background:linear-gradient(90deg,var(--cy),var(--bl));width:0;transition:width .3s}
.ld-sub{font-size:13px;color:var(--t3)}
/* Header */
header{background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;display:flex;align-items:center;padding:0 20px;height:54px}
.logo{font-weight:700;font-size:16px;color:var(--tx);margin-right:28px;white-space:nowrap}.logo span{color:var(--cy)}
.dbtabs{display:flex;gap:2px;flex:1}
.dbtab{padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--t2);border:1px solid transparent;transition:all .15s;background:none;font-family:var(--sans);display:flex;align-items:center;gap:8px}
.dbtab:hover{color:var(--tx);background:var(--s2)}.dbtab.on{background:var(--b1);color:var(--tx);border-color:var(--b2)}
.hst{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--b3)}.dot.ok{background:var(--gn);box-shadow:0 0 8px var(--gn)}
/* Layout */
.main{flex:1;display:grid;grid-template-columns:33% 1fr;overflow:hidden}
/* Sidebar */
.sidebar{background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--b1);flex-shrink:0}
.sb-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:6px}
.sb-hint{font-size:13px;color:var(--t3);line-height:1.7}
.sb-body{flex:1;overflow-y:scroll;padding:10px 8px 16px 10px;scroll-behavior:smooth}
.sb-body::-webkit-scrollbar{width:6px}
.sb-body::-webkit-scrollbar-track{background:var(--b1);border-radius:3px}
.sb-body::-webkit-scrollbar-thumb{background:var(--b3);border-radius:3px;min-height:40px}
.sb-body::-webkit-scrollbar-thumb:hover{background:var(--cy)}
.sb-body{scrollbar-width:thin;scrollbar-color:var(--b3) var(--b1)}
.sb-fade{position:absolute;bottom:0;left:0;right:0;height:48px;background:linear-gradient(transparent,var(--s1));pointer-events:none;transition:opacity .2s;z-index:10}
.ctrl-fade{pointer-events:none;height:40px;background:linear-gradient(transparent,var(--s3));margin-top:-40px;position:sticky;bottom:0;z-index:5;flex-shrink:0}
.sb-sect{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--pu);padding:12px 8px 6px}
.tbl-card{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;border:1px solid transparent;margin-bottom:5px;cursor:pointer;transition:all .14s;user-select:none}
.tbl-card:hover{background:var(--s2);border-color:var(--b1)}.tbl-card.sel{background:var(--cy2);border-color:var(--cy3)}
.tbl-card.bridge{background:var(--pu2);border-color:var(--pu3);cursor:default;opacity:.9}
.tc-chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--b3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;transition:all .12s}
.tbl-card.sel .tc-chk{background:var(--cy);border-color:var(--cy);color:#050810}
.tc-icon{font-size:19px;flex-shrink:0}.tc-name{font-size:15px;font-weight:500;flex:1;line-height:1.3}
.tbl-card.sel .tc-name{color:var(--cy)}.tbl-card.bridge .tc-name{color:var(--pu)}
.tc-cnt{font-size:13px;color:var(--t3)}
/* Right col */
.right{display:flex;flex-direction:column;overflow:hidden}
.controls-panel{display:flex;flex-direction:column;overflow-y:scroll;max-height:55vh;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--b3) var(--b1)}
.controls-panel::-webkit-scrollbar{width:6px}
.controls-panel::-webkit-scrollbar-track{background:var(--b1)}
.controls-panel::-webkit-scrollbar-thumb{background:var(--b3);border-radius:3px;min-height:30px}
.controls-panel::-webkit-scrollbar-thumb:hover{background:var(--cy)}
/* Toolbar */
.toolbar{background:var(--s2);border-bottom:1px solid var(--b1);flex-shrink:0;padding:9px 16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:48px}
.tb-title{font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap}
.tb-no-sel{font-size:14px;color:var(--t3)}
.join-pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;background:var(--pu2);color:var(--pu);border:1px solid var(--pu3);white-space:nowrap}
.tb-sp{flex:1}
.btn{padding:6px 13px;border-radius:7px;border:1px solid var(--b2);background:var(--s3);color:var(--t2);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .14s;white-space:nowrap}
.btn:hover{border-color:var(--b3);color:var(--tx)}.btn.on{border-color:var(--cy);background:var(--cy2);color:var(--cy)}
.tb-sel{background:var(--s3);border:1px solid var(--b2);border-radius:7px;color:var(--t2);font-family:var(--sans);font-size:13px;padding:6px 8px;cursor:pointer;outline:none;transition:all .14s;max-width:140px}
.tb-sel:hover,.tb-sel:focus{border-color:var(--b3);color:var(--tx)}.tb-sel option{background:var(--s2)}
.res-cnt{font-size:13px;color:var(--t3);white-space:nowrap}.res-cnt b{color:var(--cy);font-weight:700}
/* Column picker */
.cpwrap{position:relative}
.cpdrop{position:fixed;background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:8px 4px 8px 8px;min-width:240px;max-height:340px;overflow-y:auto;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;scroll-behavior:smooth}
.cpdrop::-webkit-scrollbar{width:5px}
.cpdrop::-webkit-scrollbar-track{background:var(--s3);border-radius:3px}
.cpdrop::-webkit-scrollbar-thumb{background:var(--b3);border-radius:3px}
.cpdrop::-webkit-scrollbar-thumb:hover{background:var(--cy)}
.cpdrop-fade{pointer-events:none;position:fixed;height:36px;background:linear-gradient(transparent,var(--s2));border-radius:0 0 10px 10px;z-index:1000;display:none;width:0}
.cpdrop.open{display:block}
.cp-sect{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);padding:6px 8px 3px}
.cp-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--t2);user-select:none}
.cp-row:hover{background:var(--s3);color:var(--tx)}
.cp-row input{width:14px;height:14px;accent-color:var(--cy);cursor:pointer;flex-shrink:0}
/* Panels */
.filter-panel,.summarize-panel{background:var(--s3);border-bottom:1px solid var(--b1);flex-shrink:0;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.panel-head{display:flex;align-items:center;gap:10px}
.panel-title{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--t2);flex:1}
.add-btn{padding:4px 11px;border-radius:5px;border:1px dashed var(--b3);background:none;color:var(--t3);font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .14s}
.add-btn:hover{border-color:var(--cy);color:var(--cy);border-style:solid}
/* Control rows */
.control-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-lbl{font-size:13px;color:var(--t2);white-space:nowrap;min-width:fit-content}
.ctrl-sel{background:var(--s2);border:1px solid var(--b2);border-radius:7px;color:var(--tx);font-family:var(--sans);font-size:13px;padding:5px 9px;outline:none;cursor:pointer;transition:border-color .14s}
.ctrl-sel:focus,.ctrl-sel:hover{border-color:var(--cy)}.ctrl-sel option{background:var(--s1)}
.ctrl-inp{background:var(--s2);border:1px solid var(--b2);border-radius:7px;color:var(--tx);font-family:var(--sans);font-size:13px;padding:5px 9px;outline:none;transition:border-color .14s;min-width:100px;flex:1;max-width:180px}
.ctrl-inp:focus{border-color:var(--cy)}.ctrl-inp::placeholder{color:var(--t3)}
.icon-del{width:26px;height:26px;border-radius:5px;border:1px solid var(--b2);background:var(--s2);color:var(--t3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.icon-del:hover{background:var(--rd2);border-color:var(--rd);color:var(--rd)}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Results */
.results{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tscroll{flex:1;overflow:auto}
.tscroll::-webkit-scrollbar{width:7px;height:7px}.tscroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
table{width:max-content;min-width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:5}
th{background:var(--s2);padding:10px 20px;font-size:12px;font-weight:600;color:var(--t2);text-align:left;border-bottom:2px solid var(--b2);white-space:nowrap;letter-spacing:.4px;cursor:pointer;user-select:none;transition:color .12s}
th:hover{color:var(--tx)}th.asc::after{content:" ↑";color:var(--cy)}th.desc::after{content:" ↓";color:var(--cy)}
td{padding:10px 20px;border-bottom:1px solid var(--b1);font-size:14px;color:var(--tx);white-space:nowrap;background:var(--bg)}
tr:hover td{background:var(--s1)}
.null{color:var(--t3);font-style:italic}.num{color:var(--am);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500}
.py{background:rgba(52,211,153,.12);color:var(--gn)}.pn{background:rgba(248,113,113,.1);color:var(--rd)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:40px}
.empty-ic{font-size:40px;opacity:.1}.empty-tx{font-size:15px;color:var(--t3);text-align:center;line-height:2}
.err-msg{color:var(--rd);font-size:13px;max-width:90%;line-height:1.9;font-family:monospace;background:var(--rd2);padding:12px 16px;border-radius:8px}

/* SQL card panel */
.sql-panel{background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;padding:10px 16px}
.sql-card{background:var(--bg);border:1px solid var(--b2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;max-height:180px}
.sql-card-head{display:flex;align-items:center;padding:8px 14px;background:var(--s2);border-bottom:1px solid var(--b1);flex-shrink:0;gap:8px}
.sql-card-dots{display:flex;gap:5px}
.sql-dot{width:10px;height:10px;border-radius:50%}
.sql-dot-r{background:#ff5f57}.sql-dot-y{background:#febc2e}.sql-dot-g{background:#28c840}
.sql-card-label{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.5px;flex:1;text-align:center}
.sql-copy-btn{padding:3px 10px;border-radius:5px;border:1px solid var(--b2);background:none;color:var(--t3);font-family:var(--sans);font-size:11px;cursor:pointer;transition:all .14s;white-space:nowrap}
.sql-copy-btn:hover{border-color:var(--cy);color:var(--cy)}
.sql-code-block{flex:1;overflow:auto;padding:14px 18px;font-family:"JetBrains Mono",monospace;font-size:13px;line-height:2;color:var(--t2);white-space:pre;user-select:text}
.sql-code-block::-webkit-scrollbar{width:4px;height:4px}.sql-code-block::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
/* syntax highlight - Oracle SQL color scheme */
.sk  {color:#569cd6;font-weight:700}          /* keywords: SELECT FROM WHERE etc */
.skf {color:#c586c0;font-weight:700}          /* functions: COUNT SUM AVG etc */
.ska {color:#4ec9b0;font-weight:700}          /* clauses: JOIN ON AND OR */
.sv  {color:#ce9178}                          /* string literals */
.sn  {color:#b5cea8}                          /* numbers */
.st  {color:#9cdcfe}                          /* table names / aliases */
.sc  {color:#6a9955;font-style:italic}        /* comments */
.sop {color:#d4d4d4}                          /* operators = > < */

</style>
</head>

<header>
  <div class="logo">Data <span>Explorer</span></div>

      <div class="sb-head">
        <div class="sb-title">Choose your data</div>
        <div class="sb-hint">Check tables to explore. Connections are automatic.</div>

  <div class="right" id="right-col">
    <div class="right-top">
      <div class="sql-panel" id="sql-panel" style="display:none">
        <div class="sql-card">
          <div class="sql-card-head">
            <div class="sql-card-dots">
              <div class="sql-dot sql-dot-r"></div>
              <div class="sql-dot sql-dot-y"></div>
              <div class="sql-dot sql-dot-g"></div>
            </div>
            <span class="sql-card-label">SQL Query</span>
            <button class="sql-copy-btn" onclick="copySql()">Copy</button>
          </div>
          <div class="sql-code-block" id="sql-code-block"></div>
        </div>
      </div>
    </div>
    <div class="results">
      <div class="tscroll" id="tscroll"><div class="empty"><div class="empty-ic">&#9672;</div><div class="empty-tx">Check the boxes on the left<br>to start exploring your data</div></div></div>
    </div>
  </div>
</div>

let lastSQL = '';

function formatSQL(sql) {
  sql = sql.replace(/\bLIMIT\s+(\d+)\b/gi, function(m,n){ return '/* Top ' + n + ' rows via ROWNUM */'; });
  const CLAUSE = /\b(SELECT DISTINCT|SELECT|FROM|INNER JOIN|LEFT JOIN|RIGHT JOIN|FULL OUTER JOIN|FULL JOIN|JOIN|ON|WHERE|AND|OR|GROUP BY|HAVING|ORDER BY)\b/gi;
  const NL = '\n';
  const mainClauses  = ['SELECT','SELECT DISTINCT','FROM','WHERE','GROUP BY','HAVING','ORDER BY'];
  const joinClauses  = ['INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL OUTER JOIN','FULL JOIN','JOIN'];
  let parts = sql.replace(/\s+/g,' ').trim().split(CLAUSE);
  let out = '';
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i].trim();
    if (!p) continue;
    const upper = p.toUpperCase();
    if (mainClauses.indexOf(upper) >= 0) {
      out += (out ? NL : '') + upper;
    } else if (joinClauses.indexOf(upper) >= 0) {
      out += NL + upper;
    } else if (upper === 'ON') {
      out += NL + '    ON';
    } else if (upper === 'AND') {
      out += NL + '  AND';
    } else if (upper === 'OR') {
      out += NL + '   OR';
    } else {
      const prev = (i > 0 ? parts[i-1] : '').trim().toUpperCase();
      if (prev === 'SELECT' || prev === 'SELECT DISTINCT') {
        const cols = p.split(',').map(function(c){ return c.trim(); });
        out += NL + '  ' + cols.join(',' + NL + '  ');
      } else {
        out += ' ' + p;
      }
    }
  }
  return out.trim();
}

function highlightSQL(sql) {
  let s = sql.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tokens = [];
  function tok(cls, text) {
    tokens.push('<span class="' + cls + '">' + text + '</span>');
    return '\x00T' + (tokens.length - 1) + '\x00';
  }
  s = s.replace(/'[^']*'/g, function(m) { return tok('sv', m); });
  s = s.replace(/--[^\n]*/g, function(m) { return tok('sc', m); });
  s = s.replace(/\b(COUNT|SUM|AVG|MIN|MAX|ROUND|COALESCE|LENGTH|UPPER|LOWER|TRIM|SUBSTR|TO_DATE|TO_CHAR|NVL|DECODE|TRUNC|SYSDATE|ROWNUM)\b(?=\s*\()/gi,
    function(m) { return tok('skf', m.toUpperCase()); });
  s = s.replace(/\b(INNER\s+JOIN|LEFT\s+JOIN|RIGHT\s+JOIN|FULL\s+OUTER\s+JOIN|FULL\s+JOIN)\b/gi,
    function(m) { return tok('ska', m.replace(/\s+/g,' ').toUpperCase()); });
  s = s.replace(/\b(ON|AND|OR|NOT|IN|BETWEEN|LIKE|IS\s+NOT\s+NULL|IS\s+NULL)\b/gi,
    function(m) { return tok('ska', m.replace(/\s+/g,' ').toUpperCase()); });
  s = s.replace(/\b(SELECT\s+DISTINCT|GROUP\s+BY|ORDER\s+BY)\b/gi,
    function(m) { return tok('sk', m.replace(/\s+/g,' ').toUpperCase()); });
  s = s.replace(/\b(SELECT|FROM|WHERE|HAVING|DISTINCT|AS|ASC|DESC|NULL|CASE|WHEN|THEN|ELSE|END|WITH|UNION|EXCEPT|INTERSECT)\b/gi,
    function(m) { return tok('sk', m.toUpperCase()); });
  s = s.replace(/(<>|!=|>=|<=|=|>|<)/g, function(m) { return tok('sop', m); });
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, function(m) { return tok('sn', m); });
  s = s.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\./g, function(m, alias) { return tok('st', alias) + '.'; });
  s = s.replace(/\x00T(\d+)\x00/g, function(_, i) { return tokens[+i]; });
  return s;
}

function displaySQL(sql) {
  lastSQL = sql;
  const panel = document.getElementById('sql-panel');
  const block = document.getElementById('sql-code-block');
  if (!panel || !block) return;
  panel.style.display = '';
  block.innerHTML = highlightSQL(formatSQL(sql));
}

function copySql() {
  if (!lastSQL) return;
  navigator.clipboard.writeText(lastSQL).then(() => {
    const btn = document.querySelector('.sql-copy-btn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = lastSQL; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    const btn = document.querySelector('.sql-copy-btn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  });
}

function toggleTable(name){

  if(!selectedTables.size){resetRight();return;}
  visibleCols=[];
  [...selectedTables,...bridgeTables].forEach(tn=>{
    const t=SCHEMA[currentDB].tables[tn];
    if(t) t.cols.forEach(c=>{if(!c.hide)visibleCols.push(c.id);});
  });
  rebuildRight();
  run();
}

function recomputeBridges(){
  bridgeTables=new Set();
  const schema=SCHEMA[currentDB];
  if(selectedTables.size<2)return;
  const adj={};
  schema.edges.forEach(e=>{
    (adj[e.t1]=adj[e.t1]||[]).push(e.t2);
    (adj[e.t2]=adj[e.t2]||[]).push(e.t1);
  });
  const sel=[...selectedTables];
  const visited=new Set([sel[0]]);
  const queue=[sel[0]];
  const parent={};
  while(queue.length){
    const curr=queue.shift();
    for(const nb of(adj[curr]||[])){if(!visited.has(nb)){visited.add(nb);parent[nb]=curr;queue.push(nb);}}
  }
  const needed=new Set(sel);
  for(const t of sel){let c=t;while(c&&c!==sel[0]){needed.add(c);c=parent[c];}}
  for(const t of needed) if(!selectedTables.has(t)&&SCHEMA[currentDB].tables[t]) bridgeTables.add(t);
}

function buildFrom(){
  const schema=SCHEMA[currentDB];
  const allT=new Set([...selectedTables,...bridgeTables]);
  const sel=[...selectedTables];
  if(!sel.length)return null;
  const start=sel[0],tDef=schema.tables[start];
  if(!tDef)return null;
  if(allT.size===1)return start+' '+tDef.alias;
  const adj={};
  schema.edges.forEach(e=>{
    (adj[e.t1]=adj[e.t1]||[]).push({nb:e.t2,e});
    (adj[e.t2]=adj[e.t2]||[]).push({nb:e.t1,e});
  });
  const visited=new Set([start]);
  const queue=[start];
  const joins=[];
  while(queue.length){
    const curr=queue.shift();
    for(const{nb,e} of(adj[curr]||[])){
      if(!visited.has(nb)&&allT.has(nb)){
        visited.add(nb);queue.push(nb);
        const nbDef=schema.tables[nb];
        joins.push((e.jtype||'INNER JOIN')+' '+nb+' '+nbDef.alias+' ON '+e.on);
      }
    }
  }
  return start+' '+tDef.alias+' '+joins.join(' ');
}

function getAvailableCols(){
  const cols=[];
  [...selectedTables,...bridgeTables].forEach(tn=>{
    const t=SCHEMA[currentDB].tables[tn];
    if(t) t.cols.forEach(c=>cols.push({...c,table:tn,tableLabel:t.label}));
  });
  return cols;
}

  dirSel.addEventListener('change',function(){sortDir=this.value;run();});
  tb.appendChild(sortSel);tb.appendChild(dirSel);

  // Show limit
  const limLbl=document.createElement('span');limLbl.style.cssText='font-size:12px;color:var(--t2)';limLbl.textContent='Show';
  tb.appendChild(limLbl);
  const limSel=document.createElement('select');limSel.className='tb-sel';
  ['10','25','50','All'].forEach(v=>{
    const opt=document.createElement('option');opt.value=v;opt.textContent=v==='All'?'all rows':v+' rows';
    if(v===rowLimit)opt.selected=true;
    limSel.appendChild(opt);
  });
  limSel.addEventListener('change',function(){rowLimit=this.value;run();});
  tb.appendChild(limSel);

  // Row count badge
  const rcSpan=document.createElement('span');rcSpan.className='res-cnt';rcSpan.id='res-cnt';
  tb.appendChild(rcSpan);

  // ── FILTER PANEL ──
  const fp=document.createElement('div');fp.className='filter-panel';fp.id='filter-panel';

  const fpHead=document.createElement('div');fpHead.className='panel-head';
  const fpTitle=document.createElement('span');fpTitle.className='panel-title';fpTitle.textContent='Only show rows where…';
  const addFBtn=document.createElement('button');addFBtn.className='add-btn';addFBtn.textContent='+ Add condition';
  addFBtn.onclick=function(){
    const cols=getAvailableCols();if(!cols.length)return;
    filters.push({col:cols[0].id,op:'equals',val:''});
    rebuildRight();run();
  };
  fpHead.appendChild(fpTitle);fpHead.appendChild(addFBtn);fp.appendChild(fpHead);

  const fRows=document.createElement('div');fRows.id='filter-rows';
  filters.forEach((f,i)=>fRows.appendChild(makeFilterRow(f,i,allCols)));
  fp.appendChild(fRows);
  ctrlPanel.appendChild(fp);

  // ── SUMMARIZE PANEL ──
  const sp=document.createElement('div');sp.className='summarize-panel';sp.id='summarize-panel';

  const spHead=document.createElement('div');spHead.className='panel-head';
  const spTitle=document.createElement('span');spTitle.className='panel-title';spTitle.textContent='Summarize by…';
  spHead.appendChild(spTitle);sp.appendChild(spHead);

  // Group by row
  const gbRow=document.createElement('div');gbRow.className='control-row';
  const gbLbl=document.createElement('span');gbLbl.className='ctrl-lbl';gbLbl.textContent='Group rows by';
  const gbSel=document.createElement('select');gbSel.className='ctrl-sel';
  const gbNone=document.createElement('option');gbNone.value='';gbNone.textContent='— do not group —';
  gbSel.appendChild(gbNone);
  allCols.forEach(c=>{
    const opt=document.createElement('option');opt.value=c.id;opt.textContent=c.label;
    if(c.id===groupByColId)opt.selected=true;
    gbSel.appendChild(opt);
  });
  gbSel.addEventListener('change',function(){
    groupByColId=this.value;aggFns={};havingRows=[];
    rebuildRight();run();
  });
  gbRow.appendChild(gbLbl);gbRow.appendChild(gbSel);sp.appendChild(gbRow);

  if(groupByColId){
    // Numeric aggregate rows
    const numCols=allCols.filter(c=>c.type==='number'&&c.id!==groupByColId);
    if(numCols.length){
      const calcLbl=document.createElement('div');calcLbl.className='ctrl-lbl';
      calcLbl.style.marginTop='10px';calcLbl.textContent='For each group, calculate:';
      sp.appendChild(calcLbl);
      numCols.forEach(c=>{
        const aggRow=document.createElement('div');aggRow.className='control-row';
        const aggColLbl=document.createElement('span');aggColLbl.className='ctrl-lbl';aggColLbl.textContent=c.label;
        const aggSel=document.createElement('select');aggSel.className='ctrl-sel';
        Object.entries(AGG_LABELS).forEach(([fn,label])=>{
          const opt=document.createElement('option');opt.value=fn;opt.textContent=label;
          if((aggFns[c.id]||'none')===fn)opt.selected=true;
          aggSel.appendChild(opt);
        });
        (function(colId){aggSel.addEventListener('change',function(){
          if(this.value==='none') delete aggFns[colId];
          else aggFns[colId]=this.value;
          havingRows=havingRows.filter(h=>h.aggCol.split('|')[0]!==colId||this.value!=='none');
          rebuildRight();run();
        });})(c.id);
        aggRow.appendChild(aggColLbl);aggRow.appendChild(aggSel);sp.appendChild(aggRow);
      });
    }

    // Having rows
    const activeAggs=Object.entries(aggFns).filter(([,v])=>v!=='none');
    if(activeAggs.length){
      const havHead=document.createElement('div');havHead.className='control-row';havHead.style.marginTop='10px';
      const havLbl=document.createElement('span');havLbl.className='ctrl-lbl';havLbl.textContent='Only keep groups where:';
      const addHBtn=document.createElement('button');addHBtn.className='add-btn';addHBtn.textContent='+ Add condition';
      addHBtn.onclick=function(){
        const[cid,fn]=activeAggs[0];
        havingRows.push({aggCol:cid+'|'+fn,op:'is more than',val:''});
        rebuildRight();run();
      };
      havHead.appendChild(havLbl);havHead.appendChild(addHBtn);sp.appendChild(havHead);

      havingRows.forEach((h,i)=>{
        const hrow=document.createElement('div');hrow.className='control-row';

        const aggSel=document.createElement('select');aggSel.className='ctrl-sel';
        activeAggs.forEach(([cid,fn])=>{
          const col=allCols.find(c=>c.id===cid);
          const opt=document.createElement('option');
          opt.value=cid+'|'+fn;
          opt.textContent=AGG_LABELS[fn]+' of '+(col?col.label:cid);
          if(h.aggCol===cid+'|'+fn)opt.selected=true;
          aggSel.appendChild(opt);
        });
        (function(idx){aggSel.addEventListener('change',function(){havingRows[idx].aggCol=this.value;rebuildRight();run();});})(i);

        const opSel=document.createElement('select');opSel.className='ctrl-sel';
        HAV_OPS.forEach(o=>{
          const opt=document.createElement('option');opt.value=o.label;opt.textContent=o.label;
          if(h.op===o.label)opt.selected=true;
          opSel.appendChild(opt);
        });
        (function(idx){opSel.addEventListener('change',function(){havingRows[idx].op=this.value;run();});})(i);

        const valInp=document.createElement('input');
        valInp.type='number';valInp.className='ctrl-inp';valInp.value=h.val||'';valInp.placeholder='number';
        (function(idx){valInp.addEventListener('input',function(){havingRows[idx].val=this.value;run();});})(i);

        const delBtn=document.createElement('button');delBtn.className='icon-del';delBtn.textContent='\u00d7';
        (function(idx){delBtn.onclick=function(){havingRows.splice(idx,1);rebuildRight();run();};})(i);

        hrow.appendChild(aggSel);hrow.appendChild(opSel);hrow.appendChild(valInp);hrow.appendChild(delBtn);
        sp.appendChild(hrow);
      });
    }
  }

  ctrlPanel.appendChild(sp);
}

function makeFilterRow(f,i,allCols){
  const row=document.createElement('div');row.className='filter-row';
  const col=allCols.find(c=>c.id===f.col)||allCols[0];
  const isNum=col&&col.type==='number';

  // Column selector
  const colSel=document.createElement('select');colSel.className='ctrl-sel';
  allCols.forEach(c=>{
    const opt=document.createElement('option');opt.value=c.id;opt.textContent=c.label;
    if(c.id===f.col)opt.selected=true;
    colSel.appendChild(opt);
  });
  (function(idx){colSel.addEventListener('change',function(){
    const cols=getAvailableCols();
    filters[idx].col=this.value;
    const nc=cols.find(c=>c.id===this.value);
    filters[idx].op=nc&&nc.type==='number'?'equals':'equals';
    filters[idx].val='';
    rebuildRight();run();
  });})(i);

  // Operator selector
  const ops=isNum?OPS_NUM:OPS_TEXT;
  const opSel=document.createElement('select');opSel.className='ctrl-sel';
  ops.forEach(o=>{
    const opt=document.createElement('option');opt.value=o.label;opt.textContent=o.label;
    if(o.label===f.op)opt.selected=true;
    opSel.appendChild(opt);
  });
  (function(idx){opSel.addEventListener('change',function(){
    filters[idx].op=this.value;
    rebuildRight();run();
  });})(i);

  // Value input
  const noVal=f.op==='is blank'||f.op==='has a value';
  const delBtn=document.createElement('button');delBtn.className='icon-del';delBtn.textContent='\u00d7';
  (function(idx){delBtn.onclick=function(){filters.splice(idx,1);rebuildRight();run();};})(i);

  row.appendChild(colSel);row.appendChild(opSel);
  if(!noVal){
    const inp=document.createElement('input');
    inp.className='ctrl-inp';
    inp.type=isNum?'number':'text';
    inp.value=f.val||'';
    inp.placeholder='enter value...';
    if(col&&col.opts){
      const dlId='dl-f'+i;
      const dl=document.createElement('datalist');dl.id=dlId;
      col.opts.forEach(o=>{const oo=document.createElement('option');oo.value=o;dl.appendChild(oo);});
      document.body.appendChild(dl);
      inp.setAttribute('list',dlId);
    }
    (function(idx){inp.addEventListener('input',function(){filters[idx].val=this.value;run();});})(i);
    row.appendChild(inp);
  }
  row.appendChild(delBtn);
  return row;
}

// ── BUILD SQL ──
function opToSQL(col,op,val){
  const ex=col.expr;
  const v=String(val||'');
  const safe=v.replace(/'/g,"''");
  switch(op){
    case 'equals':      return col.type==='number'?ex+'='+Number(v):ex+"='"+safe+"'";
    case 'is not':      return col.type==='number'?ex+'!='+Number(v):ex+"!='"+safe+"'";
    case 'is more than':return ex+'>'+Number(v);
    case 'is at least': return ex+'>='+Number(v);
    case 'is less than':return ex+'<'+Number(v);
    case 'is at most':  return ex+'<='+Number(v);
    case 'contains':    return ex+" LIKE '%"+safe.replace(/%/g,'\\%')+"%'";
    case 'starts with': return ex+" LIKE '"+safe.replace(/%/g,'\\%')+"%'";
    case 'is blank':    return '('+ex+" IS NULL OR CAST("+ex+" AS TEXT)='')";
    case 'has a value': return '('+ex+" IS NOT NULL AND CAST("+ex+" AS TEXT)!='')";
  }
  return null;
}

function run(){
  const fromSQL=buildFrom();if(!fromSQL)return;
  const allCols=getAvailableCols();
  const selCols=allCols.filter(c=>visibleCols.includes(c.id));
  if(!selCols.length)return;

  // SELECT
  let selectExpr;
  const extraGroupByCols = []; // non-numeric cols added to GROUP BY alongside the main group col
  if(groupByColId){
    const gbCol=allCols.find(c=>c.id===groupByColId);
    const parts=[];
    if(gbCol) parts.push(gbCol.expr+' AS "'+gbCol.label+'"');
    // Non-numeric visible cols go into both SELECT and GROUP BY
    selCols.forEach(c=>{
      if(c.id===groupByColId) return;
      if(c.type!=='number'){
        parts.push(c.expr+' AS "'+c.label+'"');
        extraGroupByCols.push(c.expr);
      }
    });
    // Aggregated numeric cols
    let hasAgg=false;
    selCols.forEach(c=>{
      if(c.id===groupByColId) return;
      const fn=aggFns[c.id];
      if(fn&&fn!=='none'){
        parts.push(fn+'('+c.expr+') AS "'+AGG_LABELS[fn]+' of '+c.label+'"');
        hasAgg=true;
      }
    });
    // Default: always show COUNT(*) if no aggregate is set
    if(!hasAgg) parts.push('COUNT(*) AS "Count"');
    selectExpr=parts.join(', ');
  } else {
    selectExpr=(distinctOn?'DISTINCT ':'')+selCols.map(c=>c.expr+' AS "'+c.label+'"').join(', ');
  }

  let sql='SELECT '+selectExpr+' FROM '+fromSQL;

  // WHERE
  const conds=filters.map(f=>{
    const col=allCols.find(c=>c.id===f.col);if(!col)return null;
    return opToSQL(col,f.op,f.val);
  }).filter(Boolean);
  if(conds.length) sql+=' WHERE '+conds.join(' AND ');

  // GROUP BY + HAVING
  if(groupByColId){
    const gbCol=allCols.find(c=>c.id===groupByColId);
    if(gbCol){
      const gbParts=[gbCol.expr,...extraGroupByCols];
      sql+=' GROUP BY '+gbParts.join(', ');
    }
    const havConds=havingRows.map(h=>{
      const[cid,fn]=h.aggCol.split('|');
      const col=allCols.find(c=>c.id===cid);
      if(!col||!fn)return null;
      const expr=fn+'('+col.expr+')';
      const v=Number(h.val);
      const havOp=HAV_OPS.find(o=>o.label===h.op);
      return havOp?expr+havOp.sql+v:null;
    }).filter(Boolean);
    if(havConds.length) sql+=' HAVING '+havConds.join(' AND ');
  }

  // ORDER BY
  if(sortColId){
    const col=allCols.find(c=>c.id===sortColId);
    if(col) sql+=' ORDER BY '+col.expr+' '+sortDir;
  }

  // LIMIT
  if(rowLimit!=='All') sql+=' LIMIT '+rowLimit;

  displaySQL(sql);
  const result=qdb(currentDB,sql);
  const rc=document.getElementById('res-cnt');
  if(result.error){
    document.getElementById('tscroll').innerHTML='<div class="empty"><div class="err-msg">Something went wrong: '+result.error+'</div></div>';
    if(rc)rc.textContent='';
  } else {
    lastRows=result.rows;lastCols=result.columns;
    if(rc) rc.innerHTML='<b>'+result.rows.length+'</b> result'+(result.rows.length!==1?'s':'');
    renderTable(result);
  }
}

function renderTable({columns,rows}){
  const allCols=getAvailableCols();
  const thead=columns.map((c,ci)=>{
    const col=allCols.find(ac=>ac.label===c);
    let cls='';
    if(col&&col.id===sortColId) cls=sortDir==='ASC'?'asc':'desc';
    return `<th class="${cls}" data-ci="${ci}" data-colid="${col?col.id:''}">${c}</th>`;
  }).join('');
  const tbody=rows.map(row=>'<tr>'+row.map(cell=>{
    if(cell===null||cell===undefined)return '<td><span class="null">—</span></td>';
    if(cell==='Y')return '<td><span class="pill py">Yes</span></td>';
    if(cell==='N')return '<td><span class="pill pn">No</span></td>';
    if(typeof cell==='number')return '<td class="num">'+cell+'</td>';
    return '<td>'+String(cell).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</td>';
  }).join('')+'</tr>').join('');
  const ts=document.getElementById('tscroll');
  ts.innerHTML='<table><thead><tr>'+thead+'</tr></thead><tbody>'+tbody+'</tbody></table>';
  ts.querySelectorAll('th').forEach(th=>{
    th.addEventListener('click',function(){
      const colId=this.dataset.colid;
      if(colId){
        if(sortColId===colId) sortDir=sortDir==='ASC'?'DESC':'ASC';
        else{sortColId=colId;sortDir='ASC';}
        // Update sort dropdowns
        const ss=document.querySelector('.tb-sel[data-role="sort"]');
        rebuildRight();run();
      }
    });
  });
}

function updateSbFade() {
  const sb   = document.getElementById('sb-body');
  const fade = document.getElementById('sb-fade');
  if (!sb || !fade) return;
  const atBottom = sb.scrollTop + sb.clientHeight >= sb.scrollHeight - 8;
  const canScroll = sb.scrollHeight > sb.clientHeight;
  fade.style.opacity = (canScroll && !atBottom) ? '1' : '0';
}

function updateCpFade(drop) {
  const fade = document.getElementById('cp-fade');
  if (!fade) return;
  const canScroll = drop.scrollHeight > drop.clientHeight;
  const atBottom  = drop.scrollTop + drop.clientHeight >= drop.scrollHeight - 4;
  if (canScroll && !atBottom) {
    const r = drop.getBoundingClientRect();
    fade.style.display = 'block';
    fade.style.left   = r.left + 'px';
    fade.style.width  = r.width + 'px';
    fade.style.top    = (r.bottom - 36) + 'px';
  } else {
    fade.style.display = 'none';
  }
}

function fadeOut(id){const el=document.getElementById(id);el.style.opacity='0';setTimeout(()=>el.remove(),500);}
function setStatus(s,t){document.getElementById('sdot').className='dot '+s;document.getElementById('stxt').textContent=t;}
document.addEventListener('click',()=>{
  document.querySelectorAll('.cpdrop').forEach(d=>d.classList.remove('open'));
  const fade=document.getElementById('cp-fade');
  if(fade) fade.style.display='none';
});
init().catch(e=>{setStatus('er','Failed');console.error(e);});
